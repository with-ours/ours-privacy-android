name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 2.0.0)"
        required: true
        type: string
      commit:
        description: Full release commit SHA already merged into main
        required: true
        type: string

permissions: {}

jobs:
  # Starts this workflow on main when a release PR merges.
  dispatch:
    name: Dispatch release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.repository.private == false &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release:')
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s\n' "$PR_TITLE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from the PR title" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches" \
            -f "ref=$DEFAULT_BRANCH" \
            -f "inputs[version]=$VERSION" \
            -f "inputs[commit]=$RELEASE_COMMIT"
          echo "Dispatched publish.yml on $DEFAULT_BRANCH for $VERSION at $RELEASE_COMMIT"

  # Build, tests, and lint run without publishing credentials.
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.repository.private == false &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release version and commit
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic release version such as 3.1.1" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full release commit SHA" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/$DEFAULT_BRANCH"
          git checkout --quiet --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

          GRADLE_VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "gradle.properties VERSION_NAME ($GRADLE_VERSION) does not match release version ($VERSION)" >&2
            echo "The release commit must include the version bump in gradle.properties" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$RELEASE_COMMIT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: ./gradlew test lint :oursprivacydemo:assembleDebug :oursprivacy-android:assembleRelease

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    environment: release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # push release tag, create GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # This job holds the publishing secrets; don't restore a cache other runs wrote.
          cache-disabled: true

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OURS_PRIVACY_SONATYPE_USERNAME || secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OURS_PRIVACY_SONATYPE_PASSWORD || secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OURS_PRIVACY_SONATYPE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OURS_PRIVACY_SONATYPE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew :oursprivacy-android:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag "$VERSION" "$RELEASE_COMMIT"
            git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$VERSION"
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
