name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run unit tests and lint
        run: ./gradlew test lint

      - name: Report failed unit tests
        if: failure()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.etree import ElementTree
          for path in Path("oursprivacy-android/build/test-results").rglob("TEST-*.xml"):
              for case in ElementTree.parse(path).iter("testcase"):
                  for failure in case.findall("failure"):
                      print(f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}")
                      print(failure.text or "")
          PYTEST

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build library and demo
        run: ./gradlew :oursprivacy-android:assembleRelease :oursprivacydemo:assembleDebug

      - name: Verify SDK publication metadata
        run: |
          ./gradlew :oursprivacy-android:publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false -Dmaven.repo.local="$PWD/build/maven-local"
          python3 .github/scripts/verify-publication.py

      - name: Build demo against Maven publication
        run: ./gradlew :oursprivacydemo:assembleDebug -PusePublished=true -PuseLocalPublished=true -Dmaven.repo.local="$PWD/build/maven-local"
